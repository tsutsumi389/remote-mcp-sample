[project]
name = "mcp-server"
version = "0.1.0"
description = "Sample remote MCP server (FastAPI + FastMCP Streamable HTTP) hosting the Counter MCP App"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "anyio>=4.4",
]

[project.scripts]
mcp-server = "mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
