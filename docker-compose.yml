services:
  mcp-app:
    build:
      context: .
      dockerfile: apps/mcp-app/Dockerfile
      target: dev
    working_dir: /workspace/apps/mcp-app
    volumes:
      - ./apps/mcp-app:/workspace/apps/mcp-app
      - mcp-app-node_modules:/workspace/apps/mcp-app/node_modules
      - mcp-app-dist:/workspace/apps/mcp-app/dist
    command: pnpm build:watch
    healthcheck:
      test: ["CMD-SHELL", "test -f /workspace/apps/mcp-app/dist/index.html"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 30s

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      target: dev
    working_dir: /workspace/apps/mcp-server
    volumes:
      - ./apps/mcp-server:/workspace/apps/mcp-server
      - mcp-server-venv:/workspace/apps/mcp-server/.venv
      - mcp-app-dist:/bundle:ro
    environment:
      MCP_APP_BUNDLE_PATH: /bundle/index.html
    ports:
      # Bind to host loopback only — the MCP endpoint has no auth.
      - "127.0.0.1:3001:3001"
    command: uv run uvicorn mcp_server.server:app --host 0.0.0.0 --port 3001 --reload --reload-dir /workspace/apps/mcp-server/src
    healthcheck:
      # Hit the FastAPI /health route (no curl in the image, so use Python).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3001/health').status==200 else 1)\""]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    depends_on:
      mcp-app:
        condition: service_healthy

volumes:
  mcp-app-node_modules:
  mcp-app-dist:
  mcp-server-venv:
